<!DOCTYPE html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PeachUNO</title>
<meta name="theme-color" content="#3b2e4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PeachUNO">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#3b2e4f; --night2:#5b4168;
  --cream:#fff2e9; --blush:#ffc7de; --mute:#c4b2cf;
  --cw:78px;
  --disp:"Baloo 2",ui-rounded,"SF Pro Rounded","Segoe UI Variable",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--cream);overflow:hidden;
  background:radial-gradient(120% 80% at 50% 8%,#6b4c7d 0%,transparent 60%),linear-gradient(170deg,var(--night1),var(--night2));
  background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block;user-select:none;-webkit-user-drag:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen.on{display:flex}
.pill{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:var(--blush);color:#4a2340;font-family:var(--disp);font-weight:800;padding:14px 26px;border-radius:999px;box-shadow:0 6px 0 #d99cb8;transition:transform .12s,box-shadow .12s;font-size:17px}
.pill:active{transform:translateY(4px);box-shadow:0 2px 0 #d99cb8}
.pill.ghost{background:rgba(255,255,255,.12);color:var(--cream);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.pill[disabled]{opacity:.4;pointer-events:none}
input{font:inherit;font-weight:800;width:100%;padding:13px 16px;border-radius:16px;border:0;background:rgba(255,255,255,.94);color:#4a2340;text-align:center}
input::placeholder{color:#b39ab0;font-weight:600}
h1{font-family:var(--disp);font-weight:800;margin:0;line-height:1.05}
.sub{color:var(--mute);font-size:14px;line-height:1.5;margin:0}

.card{position:relative;width:var(--cw);aspect-ratio:.706;border-radius:11%/8%;overflow:hidden;flex:0 0 auto;background:#fff;box-shadow:0 3px 8px rgba(20,8,30,.45)}
.card .ov{position:absolute;left:50%;top:50%;width:76%;height:126%;transform:translate(-50%,-50%) rotate(-32deg);border-radius:50%;background:#fff;padding:4.4%}
.card .ovin{width:100%;height:100%;border-radius:50%;background:var(--tint)}
.card>img{width:100%;height:100%;object-fit:cover}
.card.back{background:#22376f}
.card.back .ov{background:#fff}
.card.back .ovin{background:#22376f}
.card.back .bh{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);font-size:calc(var(--cw)*.3);filter:saturate(0) brightness(3)}
.card .eye{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:rgba(30,16,40,.82);border-radius:999px;font-size:calc(var(--cw)*.16);padding:2px 6px;line-height:1.3}
.card .jv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(0,0,0,.6);font-family:var(--disp);font-weight:800;font-size:calc(var(--cw)*.34);width:52%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.8)}

.pad{padding:26px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px;justify-content:flex-start;justify-content:safe center;max-width:460px;margin:0 auto;width:100%}
.stack{display:flex;flex-direction:column;gap:10px}
.hero{display:flex;justify-content:center;margin-bottom:2px}
.hero .card{--cw:64px;margin:0 -12px}
.hero .card:nth-child(1){transform:rotate(-13deg) translateY(6px)}
.hero .card:nth-child(3){transform:rotate(13deg) translateY(6px)}
.hero .card:nth-child(2){z-index:2}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.07);text-align:left;width:100%}
.opt b{font-family:var(--disp);font-size:15px;display:block}
.opt span{font-size:12.5px;color:var(--mute);line-height:1.4}
.sw{flex:0 0 46px;height:27px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;transition:background .18s;margin-top:2px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .18s}
.opt.on .sw{background:var(--blush)}
.opt.on .sw::after{transform:translateX(19px)}

.top{display:flex;align-items:center;gap:10px;padding:10px 14px 0}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blush);color:#4a2340;display:grid;place-items:center;font-family:var(--disp);font-weight:800;flex:0 0 auto}
.nm{font-family:var(--disp);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{font-size:12px;color:var(--mute)}
.turnDot{width:9px;height:9px;border-radius:50%;background:#6cd97e;box-shadow:0 0 0 0 rgba(108,217,126,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(108,217,126,0)}100%{box-shadow:0 0 0 0 rgba(108,217,126,0)}}
.iconbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.link{width:100%;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.22);font-size:12px;word-break:break-all;color:var(--mute);text-align:center;line-height:1.4}
.netdot{width:8px;height:8px;border-radius:50%;background:#6cd97e;flex:0 0 auto}
.netdot.off{background:#ff7a7a}
.netbar{display:flex;align-items:center;gap:7px;justify-content:center;font-size:12px;color:var(--mute);padding:2px 0}

.oppFan{display:flex;justify-content:center;align-items:flex-start;padding:10px 0 0;min-height:74px}
.oppFan .card{--cw:50px;margin:0 -19px;box-shadow:0 3px 7px rgba(20,8,30,.45);transform-origin:50% 130%}
.table{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;position:relative;min-height:0;padding:4px 14px 10px}
.glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(78vw,330px);aspect-ratio:1;border-radius:50%;filter:blur(38px);opacity:.5;background:var(--glowc,#fff);transition:background .5s;pointer-events:none}
.piles{display:flex;align-items:center;gap:22px;position:relative}
.pileWrap{position:relative;display:grid;place-items:center}
.pileWrap .card{--cw:96px}
.discard .card{box-shadow:0 10px 24px rgba(20,8,30,.5)}
.landed{animation:land .32s cubic-bezier(.2,1.4,.5,1)}
@keyframes land{from{transform:scale(.7) rotate(-14deg);opacity:.25}to{transform:scale(1) rotate(0)}}
.drawBadge{position:absolute;top:-9px;right:-9px;background:#ff6b8b;color:#fff;font-family:var(--disp);font-weight:800;font-size:13px;padding:4px 9px;border-radius:999px;box-shadow:0 3px 0 #cf4b6b}
.log{font-size:13px;color:var(--mute);text-align:center;min-height:19px;line-height:1.4;padding:0 10px}
.colorRing{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.dot{width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.25) inset}
.handWrap{padding:4px 0 8px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(20,8,30,.3)}
.handBar{display:flex;align-items:center;justify-content:space-between;padding:0 16px 6px;gap:10px}
.hand{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 14px;-webkit-overflow-scrolling:touch}
.hand::-webkit-scrollbar{display:none}
.hand .card{transition:transform .16s}
.hand .card.ok:active{transform:translateY(-10px)}
.hand .card.no{filter:grayscale(.65) brightness(.62)}
.unoBtn{background:#ff6b8b;box-shadow:0 5px 0 #cf4b6b;padding:10px 18px;font-size:15px}
.unoBtn.catch{background:#ffd166;box-shadow:0 5px 0 #cf9f3d;color:#4a2340}

.sheet{position:fixed;inset:0;background:rgba(25,14,35,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
.sheet.on{display:flex}
.box{background:linear-gradient(165deg,#4a3860,#3a2b4d);border-radius:26px;padding:22px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:86vh;overflow-y:auto}
.box h2{font-family:var(--disp);margin:0 0 4px;font-size:21px}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.swatch{height:66px;border-radius:18px;display:grid;place-items:end center;padding-bottom:8px;font-family:var(--disp);font-weight:800;color:rgba(0,0,0,.5);font-size:14px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.swatch.sel{outline:3px solid #fff;outline-offset:2px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.numb{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.12);font-family:var(--disp);font-weight:800;font-size:19px;display:grid;place-items:center}
.numb.sel{background:var(--blush);color:#4a2340}
.pickRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.pickRow .card{--cw:72px;cursor:pointer}
.pickRow .card.dim{filter:grayscale(.7) brightness(.55);pointer-events:none}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);text-align:center;max-width:120px}
.flash{position:fixed;inset:0;display:none;place-items:center;z-index:30;pointer-events:none;padding:24px;background:rgba(24,13,34,.6);backdrop-filter:blur(3px)}
.flash.on{display:grid}
.flashIn{display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .4s cubic-bezier(.2,1.5,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.flashIn .card{--cw:140px;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.flashTxt{font-family:var(--disp);font-weight:800;font-size:23px;text-align:center;text-shadow:0 3px 12px rgba(0,0,0,.6);max-width:300px;line-height:1.2}
.rulesList{font-size:14px;line-height:1.55;color:#efe2f0}
.rulesList li{margin-bottom:9px}
.rulesList b{color:var(--blush)}
.warn{background:#ffd166;color:#4a2340;font-weight:700;font-size:13px;padding:10px 14px;border-radius:14px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%) translateY(140%);background:#2a1c3c;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:40;transition:transform .28s;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:88vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-height:760px){:root{--cw:88px}.pileWrap .card{--cw:112px}}
</style>

<div class="screen on" id="s-home"><div class="pad">
  <div class="hero" id="hero"></div>
  <div style="text-align:center">
    <h1 style="font-size:34px">PeachUNO</h1>
    <p class="sub" style="margin-top:6px" id="homeSub">Il mazzo di Mochi &amp; Peaches, con le vostre regole.</p>
  </div>
  <div class="stack">
    <input id="nameIn" placeholder="Il tuo nome" maxlength="12" autocomplete="off">
    <button class="pill" id="btnGo">Crea una partita</button>
    <button class="pill ghost" id="btnResume" style="display:none">Riprendi l’ultima partita</button>
  </div>
</div></div>

<div class="screen" id="s-lobby"><div class="pad">
  <div style="text-align:center">
    <h1 style="font-size:24px" id="lobbyTitle">Invita la tua ragazza</h1>
    <p class="sub" style="margin-top:6px" id="lobbyHint"></p>
  </div>
  <div id="inviteBox" class="stack">
    <button class="pill" id="btnInvite">Manda il link</button>
    <div class="link" id="linkBox"></div>
  </div>
  <div class="stack" id="lobbyPlayers"></div>
  <div class="stack" id="lobbyOpts"></div>
  <button class="pill" id="btnStart">Inizia a giocare</button>
  <div class="netbar"><span class="netdot" id="netdot1"></span><span id="nettxt1">collegato</span></div>
  <button class="pill ghost" id="btnLeaveLobby">Esci</button>
</div></div>

<div class="screen" id="s-game">
  <div class="top">
    <div class="avatar" id="oppAv">?</div>
    <div class="who" style="flex:1;flex-direction:column;align-items:flex-start;gap:0">
      <div class="nm" id="oppName">In attesa…</div>
      <div class="cnt" id="oppCnt"></div>
    </div>
    <span class="netdot" id="netdot2"></span>
    <div class="turnDot" id="oppTurn" style="display:none"></div>
    <button class="iconbtn" id="btnRules">?</button>
    <button class="iconbtn" id="btnMenu">☰</button>
  </div>
  <div class="oppFan" id="oppFan"></div>
  <div class="table">
    <div class="glow" id="glow"></div>
    <div class="piles">
      <div class="pileWrap" id="drawPile"></div>
      <div class="pileWrap discard" id="discardPile"></div>
    </div>
    <div class="colorRing" id="colorRing"></div>
    <div class="log" id="logLine"></div>
  </div>
  <div class="handWrap">
    <div class="handBar">
      <div class="who"><div class="turnDot" id="myTurn" style="display:none"></div><div class="nm" id="myName">Tu</div></div>
      <div style="display:flex;gap:8px" id="handActions"></div>
    </div>
    <div class="hand" id="hand"></div>
  </div>
</div>

<div class="sheet" id="sheetPhase"><div class="box" id="phaseBox"></div></div>
<div class="sheet" id="sheetRules"><div class="box">
  <h2>Le regole</h2><div id="rulesBody" class="rulesList"></div>
  <button class="pill ghost" style="width:100%;margin-top:14px" onclick="closeSheet('sheetRules')">Chiudi</button>
</div></div>
<div class="sheet" id="sheetMenu"><div class="box">
  <h2>Partita</h2><p class="sub" id="menuInfo"></p>
  <div class="stack" style="margin-top:16px">
    <button class="pill ghost" id="btnInvite2">Manda di nuovo il link</button>
    <button class="pill ghost" id="btnRematch">Rivincita</button>
    <button class="pill ghost" id="btnLeave">Esci dalla partita</button>
    <button class="pill" onclick="closeSheet('sheetMenu')">Continua a giocare</button>
  </div>
</div></div>
<div class="flash" id="flash"><div class="flashIn" id="flashIn"></div></div>
<div class="toast" id="toast"></div>

/* ── il mazzo è una lista fissa: nello stato le carte viaggiano come numeri ── */
const CARDS = (() => {
  const a = [];
  for (const col of COLORS){
    a.push({color:col, kind:'num', rank:0, art:'n0_'+col});
    for (let n=1;n<=9;n++) for (let k=0;k<2;k++) a.push({color:col, kind:'num', rank:n, art:'n'+n+'_'+col});
    for (let k=0;k<2;k++){
      a.push({color:col, kind:'skip',  art:'skip_'+col});
      a.push({color:col, kind:'rev',   art:'rev_'+col});
      a.push({color:col, kind:'draw2', art:'draw2_'+col});
    }
  }
  for (let k=0;k<4;k++){
    a.push({color:null, kind:'wild',  art: k%2 ? 'wild_b' : 'wild_a'});
    a.push({color:null, kind:'draw4', art: ['draw4_a','draw4_b','draw4_c'][k % 3]});
  }
  a.push({color:null, kind:'duel', art:'duel'});
  a.push({color:null, kind:'duel', art:'duel'});
  a.push({color:null, kind:'jester', art:'jester'});
  a.push({color:null, kind:'jester', art:'jester_b'});
  return a;
})();

/* ══════════ collegamento fra i due telefoni ══════════
   Si pubblica con una POST "fire and forget" (nessun problema di CORS) e si
   ascolta con una WebSocket, che ai CORS non è soggetta. Ogni messaggio è lo
   stato completo della partita: vince sempre la versione più alta, quindi una
   mossa persa si ricuce da sola al messaggio successivo.                     */
const Net = {
  topic:null, ws:null, up:false, tries:0, timer:null,
  start(topic){
    this.stop(); this.topic = topic; this.open();
  },
  stop(){
    this.topic = null; clearTimeout(this.timer);
    if (this.ws){ this.ws.onclose = null; try { this.ws.close() } catch(e){} this.ws = null }
    this.setUp(false);
  },
  open(){
    if (!this.topic) return;
    try { this.ws = new WebSocket('wss://' + RELAY + '/' + this.topic + '/ws?since=10h') }
    catch(e){ return this.retry() }
    this.ws.onopen = () => { this.tries = 0; this.setUp(true) };
    this.ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data) } catch(_){ return }
      if (m.event === 'message' && m.message) onRemote(m.message);
    };
    this.ws.onclose = () => { this.setUp(false); this.retry() };
    this.ws.onerror = () => {};
  },
  retry(){
    if (!this.topic) return;
    const wait = Math.min(20000, 700 * Math.pow(1.8, this.tries++));
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.open(), wait);
  },
  send(text){
    if (!this.topic) return;
    if (text.length > 3900){ toast('Partita troppo grande da inviare'); return }
    fetch('https://' + RELAY + '/' + this.topic, {method:'POST', mode:'no-cors', body:text}).catch(()=>{});
  },
  setUp(v){
    this.up = v;
    document.querySelectorAll('.netdot').forEach(d => d.classList.toggle('off', !v));
    const t = $('#nettxt1'); if (t) t.textContent = v ? 'collegato' : 'riconnessione…';
  }
};

let lastSync = 0, lastPing = 0;

const myIdx = () => S ? S.players.findIndex(p => p && p.id === ME.id) : -1;
const isMine = () => S && !S.phase && S.status === 'playing' && S.players[S.turn] && S.players[S.turn].id === ME.id;
const WILDLIKE = ['wild','draw4','duel','jester'];

function newDeck(o){
  const d = []; for (let i=0;i<BASE;i++) d.push(i);
  if (o.specials) for (let i=BASE;i<CARDS.length;i++) d.push(i);
  return shuffle(d);
}
function topRank(s){
  const i = s.discard[s.discard.length-1], c = C(i);
  return c.kind === 'num' ? c.rank : (c.kind === 'jester' && s.jv[i] ? s.jv[i][1] : null);
}
function topKind(s){ const k = C(s.discard[s.discard.length-1]).kind; return k === 'jester' ? 'num' : k }

function playable(i, s){
  const c = C(i);
  if (s.phase) return false;
  if (s.pending > 0){
    if (!s.opts.stack) return false;
    if (c.kind === 'draw4') return true;
    if (c.kind === 'draw2' && s.pendingType === 'draw2') return true;
    return false;
  }
  if (WILDLIKE.includes(c.kind)) return true;
  if (c.color === s.color) return true;
  const tr = topRank(s), tk = topKind(s);
  if (c.kind === 'num' && tr !== null && c.rank === tr) return true;
  if (c.kind !== 'num' && c.kind === tk) return true;
  return false;
}

function drawFrom(s, n){
  const out = [];
  for (let k=0;k<n;k++){
    if (!s.deck.length){
      if (s.discard.length < 2) break;
      const t = s.discard.pop(); s.deck = shuffle(s.discard); s.discard = [t];
    }
    out.push(s.deck.pop());
  }
  return out;
}
function giveTo(s, pi, n){ const c = drawFrom(s, n); s.players[pi].hand.push(...c); return c.length }
function say(s, t){ s.log = t }
function flashCard(s, art, txt){ s.flash = {art, txt, ts: Date.now()} }
function unhide(s, i){ s.revealed = s.revealed.filter(x => x !== i) }

/* applica una mossa allo stato locale, poi la spedisce */
function commit(fn){
  if (!S) return;
  if (fn(S) === false){ render(); return }
  S.v++; S.by = ME.id; S.ts = Date.now();
  persist(); render(); push();
}
function push(){ lastSync = Date.now(); Net.send(JSON.stringify(S)) }
function persist(){ if (S) store.set('game', S) }

/* stato in arrivo dall'altro telefono */
function onRemote(text){
  let r; try { r = JSON.parse(text) } catch(e){ return }
  if (!r || !r.code || (S && r.code !== S.code)) return;
  if (r.ping){                       // battito: serve solo a scoprire chi è indietro
    if (!S || r.by === ME.id) return;
    if (r.v < S.v) push();
    else if (r.v > S.v) ping(true);
    return;
  }
  lastSync = Date.now();
  if (!S){ S = r; persist(); render(); return }
  const newer = r.v > S.v || (r.v === S.v && r.ts > S.ts) || (r.v === S.v && r.ts === S.ts && String(r.by) > String(S.by));
  if (newer){ S = r; persist(); render(); return }
  if (r.v < S.v && Date.now() - lastRebroadcast > 3000){   // l'altro è indietro: rimandagli il mio
    lastRebroadcast = Date.now();
    push();
  }
}

/* Se una mossa si perde per strada i due telefoni resterebbero fermi ad
   aspettarsi a vicenda. Ogni tanto, quando non passa niente, ci si scambia un
   battito con il solo numero di versione: chi è avanti rimanda la partita. */
function ping(now){
  if (!S || !Net.topic) return;
  if (!now && Date.now() - lastPing < 4500) return;
  lastPing = Date.now();
  Net.send(JSON.stringify({code:S.code, v:S.v, by:ME.id, ping:1}));
}
setInterval(() => {
  if (!S || !Net.topic || document.hidden) return;
  if (S.phase && S.phase.t === 'cancel' && S.phase.until < Date.now() && S.phase.by === myIdx())
    return commit(s => (s.phase && s.phase.t === 'cancel') ? resolveCancel(s, null) : false);
  if (Date.now() - lastSync > 9000) ping(false);
}, 4000);

function endTurn(s, skip){
  s.phase = null;
  const cur = s.turn;
  if (s.players[cur].hand.length === 0){ s.status='over'; s.winner=cur; s.uno=null; return }
  if (s.players[cur].hand.length === 1) s.uno = {p:cur, called:false, until: Date.now() + 5000};
  if (s.uno && s.players[s.uno.p].hand.length !== 1) s.uno = null;
  s.turn = (cur + (skip ? 2 : 1)) % 2;
}
const cancellable = (s, kind) =>
  kind === 'duel' || kind === 'rev' || (s.opts.noStops && (kind === 'draw2' || kind === 'draw4'));

function playFromHand(s, pi, ci, choice){
  const hand = s.players[pi].hand;
  const k = hand.indexOf(ci);
  if (k < 0 || !playable(ci, s)) return false;
  const c = C(ci);
  hand.splice(k, 1); unhide(s, ci);
  if (choice && choice.rank !== undefined) s.jv[ci] = [choice.color, choice.rank];
  s.discard.push(ci);
  if (c.color) s.color = c.color;

  const other = 1 - pi;
  if (cancellable(s, c.kind) && s.players[other].hand.some(x => C(x).kind === 'skip')){
    s.phase = {t:'cancel', by:pi, kind:c.kind, choice: choice || null, until: Date.now() + 30000};
    say(s, s.players[other].name + ' può rispondere con un NO!');
    return true;
  }
  applyCard(s, ci, pi, choice);
  return true;
}

function applyCard(s, ci, pi, choice){
  const c = C(ci), me = s.players[pi].name, other = 1 - pi;
  let skip = false;
  switch (c.kind){
    case 'num':
      say(s, me + ' gioca ' + c.rank);
      if (s.opts.sevenZero && (c.rank === 7 || c.rank === 0)){
        const t = s.players[pi].hand; s.players[pi].hand = s.players[other].hand; s.players[other].hand = t;
        flashCard(s, null, c.rank === 7 ? 'Sette! Mani scambiate' : 'Zero! Mani scambiate');
      }
      break;
    case 'skip': skip = true; say(s, me + ' dice NO!: turno saltato'); break;
    case 'draw2': s.pending += 2; s.pendingType = 'draw2'; say(s, me + ' gioca +2'); break;
    case 'draw4': s.pending += 4; s.pendingType = 'draw4'; s.color = choice.color; say(s, me + ' gioca +4'); break;
    case 'wild': s.color = choice.color; say(s, me + ' cambia in ' + CNAME[choice.color]); break;
    case 'jester':
      s.color = choice.color;
      say(s, me + ' gioca il Giullare: vale ' + choice.rank + ' ' + CNAME[choice.color].toLowerCase());
      break;
    case 'rev':
      if (!s.players[other].hand.length || !s.players[pi].hand.length){ say(s, me + ' gioca Rivela'); break }
      s.phase = {t:'reveal', by:pi};
      say(s, me + ' sceglie una carta da rivelare');
      return;
    case 'duel':
      if (!s.players[pi].hand.length) break;
      s.phase = {t:'arma', by:pi, slots: shuffle(['angel','devil'])};
      say(s, 'ARMAGEDDON! ' + s.players[other].name + ' deve scegliere');
      flashCard(s, 'duel', 'Armageddon!');
      return;
  }
  endTurn(s, skip);
}

function doDraw(s){
  const pi = s.turn;
  if (s.pending > 0){
    const n = giveTo(s, pi, s.pending);
    say(s, s.players[pi].name + ' pesca ' + n);
    s.pending = 0; s.pendingType = null; endTurn(s, false); return true;
  }
  if (s.opts.drawUntil){
    let n = 0, got = false;
    while (n < 12){
      const c = drawFrom(s, 1)[0]; if (c === undefined) break;
      s.players[pi].hand.push(c); n++;
      if (playable(c, s)){ got = true; break }
    }
    say(s, s.players[pi].name + ' pesca ' + n);
    if (!got) endTurn(s, false);
    return true;
  }
  giveTo(s, pi, 1);
  say(s, s.players[pi].name + ' pesca una carta');
  endTurn(s, false);
  return true;
}

/* ── fasi interattive ── */
function resolveCancel(s, ci){
  const ph = s.phase, by = ph.by, other = 1 - by;
  const played = s.discard[s.discard.length-1];
  if (ci !== null && ci !== undefined){
    const hand = s.players[other].hand, k = hand.indexOf(ci);
    if (k < 0 || C(ci).kind !== 'skip') return false;
    hand.splice(k, 1); unhide(s, ci);
    s.discard.push(ci); s.color = C(ci).color;
    flashCard(s, C(ci).art, 'NO! ' + KNAME[ph.kind] + ' annullato');
    say(s, s.players[other].name + ' annulla ' + KNAME[ph.kind] + ' con un NO!');
    s.phase = null;
    if (!hand.length){ s.status='over'; s.winner=other; s.uno=null; return true }
    if (hand.length === 1) s.uno = {p:other, called:false, until: Date.now() + 5000};
    s.turn = by;
    return true;
  }
  s.phase = null;
  applyCard(s, played, by, ph.choice);
  return true;
}
function resolveArma(s, slot){
  const ph = s.phase, by = ph.by, other = 1 - by;
  const got = ph.slots[slot];
  const devilOwner = got === 'devil' ? other : by;
  giveTo(s, devilOwner, 8);
  flashCard(s, got, got === 'devil'
    ? s.players[other].name + ' pesca il Diavoletto: +8'
    : s.players[other].name + ' pesca l’Angioletto');
  say(s, s.players[devilOwner].name + ' pesca 8 carte');
  s.phase = {t:'armaColor', who: 1 - devilOwner, by};
  return true;
}
function resolveArmaColor(s, color){
  const by = s.phase.by;
  s.color = color; s.phase = null;
  say(s, 'Si continua in ' + CNAME[color]);
  s.turn = by; endTurn(s, false);
  return true;
}
function resolveReveal(s, ci){
  const by = s.phase.by, other = 1 - by;
  if (!s.players[other].hand.includes(ci)) return false;
  if (!s.revealed.includes(ci)) s.revealed.push(ci);
  s.phase = null;
  say(s, s.players[by].name + ' ha rivelato una carta di ' + s.players[other].name);
  s.turn = by; endTurn(s, false);
  return true;
}

/* ══════════ render ══════════ */
function cardHTML(ci, cls, style){
  const c = C(ci);
  const jvv = (c.kind === 'jester' && S && S.jv[ci])
    ? '<div class="jv" style="background:' + CHEX[S.jv[ci][0]] + '">' + S.jv[ci][1] + '</div>' : '';
  return '<div' + (style ? ' style="' + style + '"' : '') + ' class="card ' + (cls || '') + '" data-i="' + ci + '">'
    + '<img src="' + ART[c.art] + '" alt="">' + jvv + '</div>';
}
const backHTML = style => '<div class="card back"' + (style ? ' style="' + style + '"' : '') + '><div class="ov"><div class="ovin"></div></div><div class="bh">🐾</div></div>';

function render(){
  if (!S) return;
  if (S.status === 'lobby'){ closeSheet('sheetPhase'); renderLobby(); return }
  show('s-game');
  const mi = myIdx(), oi = 1 - mi, me = S.players[mi], opp = S.players[oi];
  if (!me) return;

  $('#oppName').textContent = opp ? opp.name : 'In attesa…';
  $('#oppAv').textContent = opp ? opp.name[0].toUpperCase() : '?';
  $('#oppCnt').textContent = opp ? opp.hand.length + ' carte' : '';
  $('#myName').textContent = me.name;
  $('#oppTurn').style.display = (S.status==='playing' && !isMine() && !S.phase) ? '' : 'none';
  $('#myTurn').style.display  = isMine() ? '' : 'none';

  if (opp){
    const n = Math.min(opp.hand.length, 11);
    $('#oppFan').innerHTML = opp.hand.slice(0, n).map((ci, k) => {
      const a = 'transform:rotate(' + ((k - (n-1)/2) * 5.5).toFixed(1) + 'deg)';
      return S.revealed.includes(ci) ? cardHTML(ci, '', a) : backHTML(a);
    }).join('');
  } else $('#oppFan').innerHTML = '';

  const top = S.discard[S.discard.length-1];
  const fresh = top !== lastTop; lastTop = top;
  $('#discardPile').innerHTML = cardHTML(top, fresh ? 'landed' : '');
  $('#drawPile').innerHTML = backHTML() + (S.pending ? '<div class="drawBadge">+' + S.pending + '</div>' : '');
  $('#glow').style.setProperty('--glowc', CHEX[S.color]);
  $('#colorRing').innerHTML = '<span class="dot" style="background:' + CHEX[S.color] + '"></span> ' + CNAME[S.color]
    + ' · ' + (S.deck.length ? S.deck.length + ' nel mazzo' : 'mazzo finito');
  $('#logLine').textContent = S.status === 'over'
    ? (S.players[S.winner].id === ME.id ? '🎉 Hai vinto!' : S.players[S.winner].name + ' ha vinto')
    : (S.log || '');

  $('#hand').innerHTML = me.hand.map(ci => {
    const h = cardHTML(ci, isMine() && playable(ci, S) ? 'ok' : 'no');
    return S.revealed.includes(ci) ? h.replace('</div>', '<div class="eye">👁</div></div>') : h;
  }).join('');

  const acts = [];
  if (S.status === 'over') acts.push('<button class="pill unoBtn" data-act="rematch">Rivincita</button>');
  else if (isMine()){
    const forced = S.opts.drawUntil && !S.pending && me.hand.some(ci => playable(ci, S));
    if (!forced) acts.push('<button class="pill ghost" data-act="draw" style="padding:10px 18px;font-size:15px">'
      + (S.pending ? 'Pesca ' + S.pending : 'Pesca') + '</button>');
  }
  if (S.uno && S.uno.until > Date.now() && !S.uno.called){
    acts.push(S.uno.p === mi
      ? '<button class="pill unoBtn" data-act="uno">UNO!</button>'
      : '<button class="pill unoBtn catch" data-act="catch">Beccato!</button>');
    clearTimeout(unoTicker);
    unoTicker = setTimeout(render, Math.max(300, S.uno.until - Date.now() + 100));
  }
  $('#handActions').innerHTML = acts.join('');

  if (S.flash && S.flash.ts > lastFlash){
    lastFlash = S.flash.ts;
    $('#flashIn').innerHTML = (S.flash.art ? '<div class="card"><img src="' + ART[S.flash.art] + '" alt=""></div>' : '')
      + '<div class="flashTxt">' + S.flash.txt + '</div>';
    $('#flash').classList.add('on');
    setTimeout(()=>$('#flash').classList.remove('on'), 2400);
  }
  $('#menuInfo').textContent = 'Partita ' + S.code;
  renderPhase();
}

function renderPhase(){
  const ph = S.phase;
  if (!ph || S.status !== 'playing'){ if (!pendingCard) closeSheet('sheetPhase'); return }
  const mi = myIdx(), box = $('#phaseBox');
  const waiting = who => '<h2>Un attimo…</h2><p class="sub">Tocca a ' + S.players[who].name + '.</p>';
  if (ph.t === 'cancel'){
    const target = 1 - ph.by;
    if (mi !== target) box.innerHTML = waiting(target);
    else box.innerHTML = '<h2>NO!?</h2><p class="sub">' + S.players[ph.by].name + ' ha giocato ' + KNAME[ph.kind]
      + '. Puoi annullarlo giocando un NO!, ma ci rimetti il tuo turno.</p><div class="pickRow">'
      + S.players[mi].hand.filter(ci => C(ci).kind === 'skip').map(ci => cardHTML(ci, 'ok')).join('')
      + '</div><button class="pill ghost" style="width:100%" data-act="letit">Lascia stare</button>';
  } else if (ph.t === 'arma'){
    const target = 1 - ph.by;
    if (mi !== target) box.innerHTML = waiting(target);
    else box.innerHTML = '<h2>Armageddon</h2><p class="sub">Una è l’Angioletto, l’altra il Diavoletto. Chi prende il Diavoletto pesca 8 carte, chi prende l’Angioletto sceglie il colore.</p>'
      + '<div class="pickRow"><div class="slot"><div data-slot="1">' + backHTML() + '</div>Davanti a te</div>'
      + '<div class="slot"><div data-slot="0">' + backHTML() + '</div>Davanti a ' + S.players[ph.by].name + '</div></div>';
  } else if (ph.t === 'armaColor'){
    if (mi !== ph.who) box.innerHTML = waiting(ph.who);
    else box.innerHTML = '<h2>Hai l’Angioletto</h2><p class="sub">Scegli il colore con cui si continua.</p><div class="swatches">'
      + COLORS.map(c => '<button class="swatch" data-armacolor="' + c + '" style="background:' + CHEX[c] + '">' + CNAME[c] + '</button>').join('') + '</div>';
  } else if (ph.t === 'reveal'){
    if (mi !== ph.by) box.innerHTML = waiting(ph.by);
    else {
      const opp = S.players[1 - mi];
      box.innerHTML = '<h2>Rivela</h2><p class="sub">Scegli una carta nella mano di ' + opp.name + '. Da adesso resterà scoperta per te.</p><div class="pickRow">'
        + opp.hand.map(ci => S.revealed.includes(ci) ? cardHTML(ci, 'dim') : '<div data-rev="' + ci + '">' + backHTML() + '</div>').join('') + '</div>';
    }
  }
  openSheet('sheetPhase');
}

function shareLink(){ return location.origin + location.pathname + '#g=' + S.code }

function renderLobby(){
  show('s-lobby');
  const host = S.players[0].id === ME.id;
  const full = !!S.players[1];
  $('#lobbyTitle').textContent = full ? 'Pronti' : (host ? 'Invita la tua ragazza' : 'Ci siamo quasi');
  $('#lobbyHint').textContent = full
    ? (host ? 'Scegli le regole e via.' : 'Aspetta che ' + S.players[0].name + ' faccia partire la partita.')
    : (host ? 'Mandale questo link: le basta aprirlo, niente da installare e nessun account.' : 'Sto entrando…');
  $('#inviteBox').style.display = (host && !full) ? '' : 'none';
  $('#linkBox').textContent = shareLink();
  $('#lobbyPlayers').innerHTML = [0,1].map(i => {
    const p = S.players[i];
    return '<div class="opt" style="align-items:center"><div class="avatar">' + (p ? p.name[0].toUpperCase() : '…') + '</div>'
      + '<div><b>' + (p ? p.name : 'In attesa…') + '</b><span>' + (i===0 ? 'ha creato la partita' : 'ospite') + '</span></div></div>';
  }).join('');
  const OPTS = [
    ['specials','Carte speciali','Armageddon (×2) e Giullare (×2) nel mazzo. Angioletto e Diavoletto restano da parte.'],
    ['noStops','Il NO! ferma anche +2 e +4','Oltre ad Armageddon e Rivela, il NO! può annullare le carte pesca.'],
    ['stack','Cumulo +2 e +4','Puoi rispondere a un +2 con un altro +2 (o un +4) e passare tutto all’altra.'],
    ['drawUntil','Pesca finché non puoi','Invece di una sola carta, peschi finché non ne esce una giocabile.'],
    ['sevenZero','Regola 7-0','Chi gioca un 7 o uno 0 scambia la mano con l’avversaria.']
  ];
  $('#lobbyOpts').innerHTML = OPTS.map(([k,t,d]) =>
    '<button class="opt ' + (S.opts[k] ? 'on' : '') + '" data-opt="' + k + '"' + (host ? '' : ' disabled style="opacity:.6"') + '>'
    + '<div class="sw"></div><div><b>' + t + '</b><span>' + d + '</span></div></button>').join('');
  $('#btnStart').style.display = host ? '' : 'none';
  $('#btnStart').disabled = !full;
  $('#btnStart').textContent = full ? 'Inizia a giocare' : 'Aspetto l’altra giocatrice…';
}

/* ══════════ eventi ══════════ */
const byArt = a => CARDS.findIndex(c => c.art === a);
$('#hero').innerHTML = [byArt('n7_red'), byArt('jester'), byArt('n2_blue')].map(i => cardHTML(i)).join('');

let joinCode = (location.hash.match(/g=([a-z0-9]+)/) || [])[1] || null;

function ensureMe(){
  const n = $('#nameIn').value.trim();
  if (!n){ toast('Scrivi il tuo nome'); return null }
  ME = {id: ME.id || 'p' + rnd(10), name: n};
  store.set('me', ME);
  return ME;
}

$('#btnGo').onclick = () => {
  if (!ensureMe()) return;
  if (joinCode) return joinGame(joinCode);
  S = { v:1, ts:Date.now(), by:ME.id, code: rnd(9), status:'lobby',
    players:[{id:ME.id, name:ME.name, hand:[]}, null],
    deck:[], discard:[], color:'green', turn:0, pending:0, pendingType:null,
    uno:null, log:'', flash:null, winner:null, revealed:[], phase:null, jv:{},
    opts:{specials:true, noStops:true, stack:true, drawUntil:false, sevenZero:false} };
  persist(); Net.start(S.code); render();
  setTimeout(push, 400);
};

function joinGame(code){
  show('s-lobby');
  $('#lobbyTitle').textContent = 'Cerco la partita…';
  $('#lobbyHint').textContent = 'Un attimo.';
  $('#inviteBox').style.display = 'none';
  $('#lobbyPlayers').innerHTML = ''; $('#lobbyOpts').innerHTML = '';
  $('#btnStart').style.display = 'none';
  S = null; Net.start(code);
  let tries = 0;
  const t = setInterval(() => {
    if (S){
      clearInterval(t);
      if (!S.players.some(p => p && p.id === ME.id)){
        if (S.players[1]){ toast('La partita è già in due'); Net.stop(); S = null; show('s-home'); return }
        commit(s => { s.players[1] = {id:ME.id, name:ME.name, hand:[]} });
      } else render();
      return;
    }
    if (++tries > 14){
      clearInterval(t);
      toast('Non trovo la partita: fattelo rimandare');
      Net.stop(); show('s-home');
    }
  }, 700);
}

function invite(){
  const url = shareLink();
  const txt = 'Giochiamo a PeachUNO 🐾 ' + url;
  if (navigator.share) navigator.share({title:'PeachUNO', text:txt}).catch(()=>{});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast('Link copiato')).catch(()=>toast(url));
  else toast(url);
}
$('#btnInvite').onclick = invite;
$('#btnInvite2').onclick = () => { closeSheet('sheetMenu'); invite() };

$('#lobbyOpts').onclick = e => {
  const b = e.target.closest('[data-opt]'); if (!b || b.disabled) return;
  commit(s => { s.opts[b.dataset.opt] = !s.opts[b.dataset.opt] });
};
$('#btnStart').onclick = () => commit(s => {
  if (!s.players[1]) return false;
  s.deck = newDeck(s.opts);
  s.players.forEach(p => p.hand = []);
  for (let i=0;i<7;i++) s.players.forEach(p => p.hand.push(s.deck.pop()));
  let first = s.deck.pop();
  while (C(first).color === null){ s.deck.unshift(first); first = s.deck.pop() }
  s.discard = [first]; s.color = C(first).color;
  s.turn = Math.round(Math.random());
  s.pending = 0; s.pendingType = null; s.uno = null; s.winner = null; s.flash = null;
  s.revealed = []; s.phase = null; s.jv = {}; s.status = 'playing';
  say(s, 'Si comincia! Inizia ' + s.players[s.turn].name);
});

$('#hand').onclick = e => {
  const el = e.target.closest('.card'); if (!el || !el.classList.contains('ok')) return;
  const ci = +el.dataset.i, c = C(ci);
  if (c.kind === 'jester'){ pendingCard = ci; jest = {color:null, rank:null}; showJester(); return }
  if (c.color === null && c.kind !== 'duel'){ pendingCard = ci; showColor(); return }
  commit(s => playFromHand(s, myIdx(), ci, null));
};
function showColor(){
  $('#phaseBox').innerHTML = '<h2>Scegli il colore</h2><p class="sub">Con quale colore si continua?</p><div class="swatches">'
    + COLORS.map(c => '<button class="swatch" data-color="' + c + '" style="background:' + CHEX[c] + '">' + CNAME[c] + '</button>').join('') + '</div>';
  openSheet('sheetPhase');
}
function showJester(){
  $('#phaseBox').innerHTML = '<h2>Giullare</h2><p class="sub">Vale come qualunque carta numero: scegli quale.</p><div class="swatches">'
    + COLORS.map(c => '<button class="swatch' + (jest.color===c?' sel':'') + '" data-jcolor="' + c + '" style="background:' + CHEX[c] + '">' + CNAME[c] + '</button>').join('') + '</div>'
    + '<div class="nums">' + Array.from({length:10},(_,i) => '<button class="numb' + (jest.rank===i?' sel':'') + '" data-jrank="' + i + '">' + i + '</button>').join('') + '</div>'
    + '<button class="pill" style="width:100%;margin-top:16px"' + (jest.color!==null && jest.rank!==null ? '' : ' disabled') + ' data-act="jok">Gioca</button>';
  openSheet('sheetPhase');
}

$('#sheetPhase').onclick = e => {
  if (e.target === $('#sheetPhase')){ if (!S || !S.phase){ closeSheet('sheetPhase'); pendingCard = null } return }
  const col = e.target.closest('[data-color]');
  if (col && pendingCard !== null){ const ci = pendingCard; pendingCard = null; closeSheet('sheetPhase');
    return commit(s => playFromHand(s, myIdx(), ci, {color: col.dataset.color})) }
  const jc = e.target.closest('[data-jcolor]'); if (jc){ jest.color = jc.dataset.jcolor; return showJester() }
  const jr = e.target.closest('[data-jrank]'); if (jr){ jest.rank = +jr.dataset.jrank; return showJester() }
  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'jok' && pendingCard !== null){
    const ci = pendingCard; pendingCard = null; closeSheet('sheetPhase');
    return commit(s => playFromHand(s, myIdx(), ci, {color: jest.color, rank: jest.rank}));
  }
  if (act && act.dataset.act === 'letit') return commit(s => s.phase && s.phase.t==='cancel' ? resolveCancel(s, null) : false);
  const no = e.target.closest('.pickRow .card.ok');
  if (no) return commit(s => s.phase && s.phase.t==='cancel' ? resolveCancel(s, +no.dataset.i) : false);
  const slot = e.target.closest('[data-slot]');
  if (slot) return commit(s => s.phase && s.phase.t==='arma' ? resolveArma(s, +slot.dataset.slot) : false);
  const ac = e.target.closest('[data-armacolor]');
  if (ac) return commit(s => s.phase && s.phase.t==='armaColor' ? resolveArmaColor(s, ac.dataset.armacolor) : false);
  const rv = e.target.closest('[data-rev]');
  if (rv) return commit(s => s.phase && s.phase.t==='reveal' ? resolveReveal(s, +rv.dataset.rev) : false);
};

$('#handActions').onclick = e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'draw') commit(s => (s.players[s.turn].id === ME.id && !s.phase) ? doDraw(s) : false);
  if (a === 'uno') commit(s => { if (!s.uno || s.uno.p !== myIdx()) return false; s.uno.called = true; say(s, s.players[s.uno.p].name + ' ha detto UNO!') });
  if (a === 'catch') commit(s => {
    if (!s.uno || s.uno.called || s.uno.until < Date.now()) return false;
    giveTo(s, s.uno.p, 2); say(s, s.players[s.uno.p].name + ' non ha detto UNO: pesca 2!'); s.uno = null;
  });
  if (a === 'rematch') rematch();
};
function rematch(){ closeSheet('sheetMenu'); commit(s => { s.status='lobby'; s.winner=null; s.flash=null; s.log=''; s.phase=null; s.revealed=[]; s.jv={} }) }
$('#btnRematch').onclick = rematch;
$('#btnMenu').onclick = () => openSheet('sheetMenu');
$('#btnLeave').onclick = $('#btnLeaveLobby').onclick = () => {
  closeSheet('sheetMenu'); Net.stop(); S = null; store.del('game');
  joinCode = null; location.hash = ''; boot();
};
$('#btnRules').onclick = () => { renderRules(); openSheet('sheetRules') };
$('#sheetRules').onclick = e => { if (e.target === $('#sheetRules')) closeSheet('sheetRules') };
$('#sheetMenu').onclick = e => { if (e.target === $('#sheetMenu')) closeSheet('sheetMenu') };

function renderRules(){
  const o = S ? S.opts : {specials:true, noStops:true, stack:true, drawUntil:false, sevenZero:false};
  let h = '<ul class="rulesList" style="padding-left:18px;margin:8px 0">';
  h += '<li>Giochi una carta dello stesso <b>colore</b> o dello stesso <b>numero/simbolo</b> di quella in cima.</li>';
  h += '<li><b>NO!</b> (il simbolo divieto): salta il turno all’altra. In più, quando lei gioca '
     + (o.noStops ? 'Armageddon, Rivela, +2 o +4' : 'Armageddon o Rivela')
     + ', puoi giocarlo fuori turno per <b>annullare l’effetto</b> — ma ci rimetti il tuo turno.</li>';
  h += '<li><b>Rivela</b> (i gatti col maglione): scegli al buio una carta nella mano dell’altra. Da quel momento resta scoperta per te.</li>';
  h += '<li><b>+2</b> e <b>+4</b>: l’altra pesca e salta il turno' + (o.stack ? ', a meno che non rilanci con un’altra carta pesca.' : '.') + '</li>';
  if (o.specials){
    h += '<li><b>Armageddon</b>: metti Angioletto e Diavoletto coperti, uno davanti a te e uno davanti a lei. Lei ne sceglie uno. Chi si ritrova il <b>Diavoletto pesca 8 carte</b>, chi ha l’<b>Angioletto sceglie il colore</b>. Poi le due carte tornano da parte.</li>';
    h += '<li><b>Giullare</b>: vale come qualunque carta numero, di qualunque colore. Dichiari tu numero e colore.</li>';
  }
  h += '<li>Quando ti resta <b>una carta</b> hai <b>5 secondi</b> per dire <b>UNO!</b>, altrimenti lei ti becca e peschi 2.</li>';
  if (o.sevenZero) h += '<li><b>7 e 0</b>: chi la gioca scambia la mano con l’altra.</li>';
  h += '</ul>';
  $('#rulesBody').innerHTML = h;
}

/* riconnessione quando il telefono torna attivo */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S && Net.topic){
    if (!Net.up){ Net.tries = 0; Net.open() }
    push();
  }
});

function boot(){
  if (ME.name) $('#nameIn').value = ME.name;
  const saved = store.get('game');
  joinCode = (location.hash.match(/g=([a-z0-9]+)/) || [])[1] || null;
  if (joinCode){
    $('#homeSub').textContent = 'Sei stato invitato a una partita. Scrivi il tuo nome per entrare.';
    $('#btnGo').textContent = 'Entra nella partita';
    if (ME.name){ ensureMe(); return joinGame(joinCode) }
    show('s-home'); return;
  }
  $('#homeSub').textContent = 'Il mazzo di Mochi & Peaches, con le vostre regole.';
  $('#btnGo').textContent = 'Crea una partita';
  if (saved && saved.code){
    $('#btnResume').style.display = '';
    $('#btnResume').onclick = () => { S = saved; Net.start(S.code); render(); setTimeout(push, 400) };
  }
  show('s-home');
}
boot();
</script>
</html>
